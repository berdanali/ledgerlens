name: ledgerlens
version: "1.0.0"
config-version: 2

profile: ledgerlens

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Full base URL for the landing zone.
  # S3/MinIO (default, requires httpfs):  s3://ledgerlens-landing
  # Local cache (Windows / no httpfs):    landing_cache
  landing_base_url: "s3://{{ env_var('MINIO_BUCKET', 'ledgerlens-landing') }}"

models:
  ledgerlens:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
