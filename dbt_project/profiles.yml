ledgerlens:
  target: dev
  outputs:
    dev:
      type: duckdb
      # DuckDB file persists marts between runs; gitignored.
      # Use :memory: if you want a clean slate every run (no persistence).
      path: "ledgerlens.duckdb"
      # httpfs extension + S3 settings are only needed when reading directly
      # from MinIO (landing_base_url = s3://...).  On Windows, Smart App
      # Control may block the httpfs DLL — use fetch_from_minio.py instead
      # and set landing_base_url to the local cache path.
      #
      # Uncomment the block below to enable S3 access:
      # extensions:
      #   - httpfs
      # settings:
      #   s3_endpoint: "{{ env_var('MINIO_S3_ENDPOINT', 'localhost:9000') }}"
      #   s3_access_key_id: "{{ env_var('MINIO_ACCESS_KEY', 'minioadmin') }}"
      #   s3_secret_access_key: "{{ env_var('MINIO_SECRET_KEY') }}"
      #   s3_use_ssl: false
      #   s3_url_style: path

    # docker target — used by Airflow inside the Linux container.
    # httpfs works here because Windows Smart App Control does not apply.
    # DuckDB file lives in the airflow_data volume, separate from the
    # dev target's file, so the two never contend for the write lock.
    docker:
      type: duckdb
      path: "/opt/airflow/ledgerlens.duckdb"
      extensions:
        - httpfs
      settings:
        s3_endpoint: "minio:9000"
        s3_access_key_id: "{{ env_var('MINIO_ROOT_USER', 'minioadmin') }}"
        s3_secret_access_key: "{{ env_var('MINIO_ROOT_PASSWORD') }}"
        s3_use_ssl: false
        s3_url_style: path
