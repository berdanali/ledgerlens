ledgerlens:
  target: dev
  outputs:
    dev:
      type: duckdb
      # DuckDB file persists marts between runs; gitignored.
      # Use :memory: if you want a clean slate every run (no persistence).
      path: "ledgerlens.duckdb"
      # httpfs extension + S3 settings are only needed when reading directly
      # from MinIO (landing_base_url = s3://...).  On Windows, Smart App
      # Control may block the httpfs DLL — use fetch_from_minio.py instead
      # and set landing_base_url to the local cache path.
      #
      # Uncomment the block below to enable S3 access:
      # extensions:
      #   - httpfs
      # settings:
      #   s3_endpoint: "{{ env_var('MINIO_S3_ENDPOINT', 'localhost:9000') }}"
      #   s3_access_key_id: "{{ env_var('MINIO_ACCESS_KEY', 'minioadmin') }}"
      #   s3_secret_access_key: "{{ env_var('MINIO_SECRET_KEY') }}"
      #   s3_use_ssl: false
      #   s3_url_style: path
