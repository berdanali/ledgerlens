version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgerlens-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledgerlens}
      POSTGRES_USER: ${POSTGRES_USER:-ledgerlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=5
      - -c
      - max_wal_senders=5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./oltp/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledgerlens} -d ${POSTGRES_DB:-ledgerlens}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
